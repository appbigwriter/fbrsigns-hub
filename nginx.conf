server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Handle favicon.ico - Return 204 No Content to prevent 500 errors
    location = /favicon.ico {
        log_not_found off;
        access_log off;
        return 204;
    }

    # SPA Routing - Fallback to index.html for non-static routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets in /assets/ folder
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Other static files by extension
    location ~* \.(?:css|js|woff2?|ttf|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
}
